sentry:
    # Empty DSN disables the SDK, so the bundle is safe to enable everywhere:
    # only environments that actually set SENTRY_DSN report anything. This keeps
    # prod and dev configured identically — presence of the DSN is the switch.
    dsn: '%env(default::SENTRY_DSN)%'
    options:
        # Tags each event with dev/test/prod so environments stay separable
        # even though the configuration is shared.
        environment: '%kernel.environment%'
        # Send request bodies and user context to help with debugging.
        # Sensitive fields are masked by the before_send callback below.
        send_default_pii: true
        # Performance tracing is disabled: the free plan has a small quota
        # and error monitoring alone covers current needs. Raise this
        # (e.g. 0.2) later if distributed tracing becomes useful.
        traces_sample_rate: 0.0
        # Scrub cookies, auth headers and personal contact fields from
        # every event before it is sent. Value is a service id.
        before_send: 'App\Common\Sentry\SentryEventSanitizer'
        # These exceptions are normal HTTP outcomes, not application faults, so
        # they would only bury real errors in noise. NotFoundHttpException fires
        # on every bogus URL a client requests (crawlers, stale links, probes).
        # AccessDeniedException fires whenever an authorization check legitimately
        # denies a request (e.g. a user without ROLE_PLAYER opening a players-only
        # page). The match includes subclasses, so more specific variants are
        # covered too.
        ignore_exceptions:
            - 'Symfony\Component\HttpKernel\Exception\NotFoundHttpException'
            - 'Symfony\Component\Security\Core\Exception\AccessDeniedException'
