# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    app.upload_dir: '%kernel.project_dir%/var/uploads/tournament_documents'
    # Defaults to enabled for the current alpha-testing period, so the env var
    # is optional. Set ALPHA_TESTING_MODE=0 on an environment to hide the banner.
    app.alpha_testing_mode_default: '1'
    app.alpha_testing_mode: '%env(default:app.alpha_testing_mode_default:bool:ALPHA_TESTING_MODE)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Common\Mapping\MappingInterface:
            tags: ['app.mapping']

    App\:
        resource: '../src/'

    App\Common\Mapping\Mapper:
        arguments:
            $mappings: !tagged_iterator app.mapping

    App\Classic\Service\TournamentDocumentService:
        arguments:
            $uploadDir: '%app.upload_dir%'

    App\Common\Service\MaintenanceService:
        arguments:
            $cache: '@cache.app'

    App\Common\Service\AlphaTestingService:
        arguments:
            $enabled: '%app.alpha_testing_mode%'

    App\Common\EventSubscriber\SecurityHeadersSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    # Monolog handler that turns log records into Sentry breadcrumbs. Wired as
    # the "sentry_breadcrumbs" handler in config/packages/monolog.yaml.
    Sentry\Monolog\BreadcrumbHandler:
        arguments:
            $hub: '@Sentry\State\HubInterface'
            $level: !php/const Monolog\Level::Info

    App\Common\EventSubscriber\RateLimitSubscriber:
        arguments:
            $rateLimiters: !service_locator
                auth: '@limiter.auth'
                claim: '@limiter.claim'
                api_suggest: '@limiter.api_suggest'
                mutation: '@limiter.mutation'
                upload: '@limiter.upload'
                moderator: '@limiter.moderator'
                read: '@limiter.read'

when@dev: &dev_fixtures
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Tests\DataFixtures\:
            resource: '../tests/DataFixtures/'

when@test: *dev_fixtures
