name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PHP_DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/php-dev
  RATING_APP_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/rating-app-test
  RATING_APP_IMAGE: ghcr.io/${{ github.repository_owner }}/rating-app

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        uses: hmarr/debug-action@v3

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build images
        run: |
          docker build -f docker/Dockerfile --target php-dev \
            -t "$PHP_DEV_IMAGE:latest" \
            -t "$PHP_DEV_IMAGE:v0.0.0-SNAPSHOT" \
            -t "$PHP_DEV_IMAGE:${{ github.sha }}" \
            .

          docker build -f docker/Dockerfile --target rating-app-test \
            -t "$RATING_APP_TEST_IMAGE:latest" \
            -t "$RATING_APP_TEST_IMAGE:v0.0.0-SNAPSHOT" \
            -t "$RATING_APP_TEST_IMAGE:${{ github.sha }}" \
            .

          docker build -f docker/Dockerfile --target rating-app \
            -t "$RATING_APP_IMAGE:latest" \
            -t "$RATING_APP_IMAGE:v0.0.0-SNAPSHOT" \
            -t "$RATING_APP_IMAGE:${{ github.sha }}" \
            .

      - name: Run app
        run: |
          source .env.test
          docker compose -f docker-compose.yml up -d

      - name: PHPCS
        id: phpcs
        continue-on-error: true
        run: docker compose exec app vendor/bin/phpcs

      - name: PHPStan
        id: phpstan
        continue-on-error: true
        run: docker compose exec app vendor/bin/phpstan analyse --memory-limit=512M

      - name: PHPUnit
        id: phpunit
        continue-on-error: true
        env:
          DATABASE_URL: mysql://rating_user:rating_pass@127.0.0.1:3306/rating?serverVersion=9.3&charset=utf8mb4
          APP_ENV: test
          APP_SECRET: ci_secret
          MYSQL_USER: rating_user
          MYSQL_PASSWORD: rating_pass
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          docker compose exec app php bin/phpunit --coverage-clover coverage.xml --coverage-text | tee coverage-output.txt

      - name: ESLint
        id: eslint
        continue-on-error: true
        run: docker compose exec app npx eslint assets/

      - name: Stylelint
        id: stylelint
        continue-on-error: true
        run: docker compose exec app npx stylelint 'assets/styles/**/*.css'

      - name: TwigCS
        id: twigcs
        continue-on-error: true
        run: docker compose exec app vendor/bin/twig-cs-fixer lint

      - name: Generate badges
        if: always()
        run: |
          mkdir -p .github/badges

          COVERAGE=$(grep -m1 'Lines:' coverage-output.txt | grep -oE '[0-9]+\.[0-9]+' | head -1 || echo "0")
          if (( $(echo "$COVERAGE >= 90" | bc -l) )); then COLOR="brightgreen";
          elif (( $(echo "$COVERAGE >= 75" | bc -l) )); then COLOR="yellow";
          elif (( $(echo "$COVERAGE >= 50" | bc -l) )); then COLOR="orange";
          else COLOR="red"; fi
          curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > .github/badges/coverage.svg

          if [[ "${{ steps.phpcs.outcome }}" == "success" ]]; then
            curl -s "https://img.shields.io/badge/PHPCS-PSR--12-brightgreen" > .github/badges/phpcs.svg
          else
            curl -s "https://img.shields.io/badge/PHPCS-PSR--12-red" > .github/badges/phpcs.svg
          fi

          if [[ "${{ steps.phpstan.outcome }}" == "success" ]]; then
            curl -s "https://img.shields.io/badge/PHPStan-level%206-brightgreen" > .github/badges/phpstan.svg
          else
            curl -s "https://img.shields.io/badge/PHPStan-level%206-red" > .github/badges/phpstan.svg
          fi

          if [[ "${{ steps.eslint.outcome }}" == "success" ]]; then
            curl -s "https://img.shields.io/badge/ESLint-passing-brightgreen" > .github/badges/eslint.svg
          else
            curl -s "https://img.shields.io/badge/ESLint-failing-red" > .github/badges/eslint.svg
          fi

          if [[ "${{ steps.stylelint.outcome }}" == "success" ]]; then
            curl -s "https://img.shields.io/badge/Stylelint-passing-brightgreen" > .github/badges/stylelint.svg
          else
            curl -s "https://img.shields.io/badge/Stylelint-failing-red" > .github/badges/stylelint.svg
          fi

          if [[ "${{ steps.twigcs.outcome }}" == "success" ]]; then
            curl -s "https://img.shields.io/badge/TwigCS-passing-brightgreen" > .github/badges/twigcs.svg
          else
            curl -s "https://img.shields.io/badge/TwigCS-failing-red" > .github/badges/twigcs.svg
          fi

      - name: Composer audit
        id: composer_audit
        continue-on-error: true
        run: docker compose exec app composer audit

      - name: Symfony security check
        id: security_check
        continue-on-error: true
        run: |
          docker compose exec app composer audit
          docker compose exec app symfony security:check

      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Log in to ghcr.io
        # TODO: if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        # TODO: if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          docker push --all-tags "$PHP_DEV_IMAGE"
          docker push --all-tags "$RATING_APP_TEST_IMAGE"
          docker push --all-tags "$RATING_APP_IMAGE"

      - name: Push badges
        if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          cp .github/badges/coverage.svg /tmp/coverage.svg
          cp .github/badges/phpcs.svg /tmp/phpcs.svg
          cp .github/badges/phpstan.svg /tmp/phpstan.svg
          cp .github/badges/eslint.svg /tmp/eslint.svg
          cp .github/badges/stylelint.svg /tmp/stylelint.svg
          cp .github/badges/twigcs.svg /tmp/twigcs.svg
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git fetch --depth=1 origin badges:badges 2>/dev/null; then
            rm -rf .github/badges
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . --quiet
          fi
          mkdir -p .github/badges
          cp /tmp/coverage.svg .github/badges/coverage.svg
          cp /tmp/phpcs.svg .github/badges/phpcs.svg
          cp /tmp/phpstan.svg .github/badges/phpstan.svg
          cp /tmp/eslint.svg .github/badges/eslint.svg
          cp /tmp/stylelint.svg .github/badges/stylelint.svg
          cp /tmp/twigcs.svg .github/badges/twigcs.svg
          git add .github/badges/
          git diff --cached --quiet && exit 0
          git commit -m "Update badges [skip ci]"
          git push origin badges

      - name: Check results
        if: always()
        run: |
          echo "PHPCS: ${{ steps.phpcs.outcome }}"
          echo "PHPStan: ${{ steps.phpstan.outcome }}"
          echo "PHPUnit: ${{ steps.phpunit.outcome }}"
          echo "ESLint: ${{ steps.eslint.outcome }}"
          echo "Stylelint: ${{ steps.stylelint.outcome }}"
          echo "TwigCS: ${{ steps.twigcs.outcome }}"
          echo "Composer audit: ${{ steps.composer_audit.outcome }}"
          echo "Security check: ${{ steps.security_check.outcome }}"
          echo "Gitleaks: ${{ steps.gitleaks.outcome }}"
          if [[ "${{ steps.phpcs.outcome }}" == "failure" || \
                "${{ steps.phpstan.outcome }}" == "failure" || \
                "${{ steps.phpunit.outcome }}" == "failure" || \
                "${{ steps.eslint.outcome }}" == "failure" || \
                "${{ steps.stylelint.outcome }}" == "failure" || \
                "${{ steps.twigcs.outcome }}" == "failure" || \
                "${{ steps.composer_audit.outcome }}" == "failure" || \
                "${{ steps.security_check.outcome }}" == "failure" || \
                "${{ steps.gitleaks.outcome }}" == "failure" ]]; then
            echo "::error::One or more checks failed"
            exit 1
          fi
