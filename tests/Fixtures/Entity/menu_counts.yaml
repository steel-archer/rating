# --- Tournaments ---

App\Classic\Entity\Tournament:
    # Co-organized by franko and lesya; franko is also game jury and appeal jury here.
    t_menu_shared:
        name: 'Спільний турнір меню'
        status: '<(App\Classic\Enum\TournamentStatus::Published)>'
        season: '@season_current'
        startedAt: '<(new \DateTimeImmutable("-30 days 00:00:00"))>'
        endedAt: '<(new \DateTimeImmutable("+30 days 00:00:00"))>'
        submissionDeadline: '<(new \DateTimeImmutable("+1 year 00:00:00"))>'
        appealDeadline: '<(new \DateTimeImmutable("+1 year 00:00:00"))>'
        toursCount: 1
        questionsPerTourMap: [3]
        createdBy: '@player_franko'
    # Draft tournament on moderation, organized solely by franko.
    t_menu_solo:
        name: 'Сольний турнір меню'
        status: '<(App\Classic\Enum\TournamentStatus::Draft)>'
        createdBy: '@player_franko'

