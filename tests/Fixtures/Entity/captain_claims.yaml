App\Common\Entity\User:
    user_cc_player:
        email: 'cc_player@example.com'
        googleId: 'google_cc_player'
        roles: []
        player: '@player_lesya'
    user_cc_in_team:
        email: 'cc_in_team@example.com'
        googleId: 'google_cc_in_team'
        roles: []
        player: '@player_franko'
    user_cc_captain:
        email: 'cc_captain@example.com'
        googleId: 'google_cc_captain'
        roles: []
        player: '@player_shevchenko'
    user_cc_moderator:
        email: 'cc_moderator@example.com'
        googleId: 'google_cc_moderator'
