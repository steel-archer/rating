App\Common\Entity\User:
    user_squad_rep:
        email: 'squad_rep@example.com'
        googleId: 'google_squad_rep'
        roles: []
        player: '@player_shevchenko'
    user_squad_other:
        email: 'squad_other@example.com'
        googleId: 'google_squad_other'
        roles: []
        player: '@player_lesya'

App\Classic\Entity\Tournament:
    tournament_squad:
        name: 'Турнір для складів'
        status: '<(App\Classic\Enum\TournamentStatus::Published)>'
        season: '@season_current'
        startedAt: '<(new \DateTimeImmutable("-30 days 00:00:00"))>'
        endedAt: '<(new \DateTimeImmutable("+30 days 00:00:00"))>'
        submissionDeadline: '<(new \DateTimeImmutable("+1 year 00:00:00"))>'
        toursCount: 3
        questionsPerTourMap: [12, 12, 12]

App\Classic\Entity\TournamentSession:
    session_squad_approved:
        tournament: '@tournament_squad'
        venue: '@venue_kyiv'
        representative: '@player_shevchenko'
        host: '@player_shevchenko'
        playedAt: '<(new \DateTimeImmutable("-1 day"))>'
        estimatedTeams: 8
    session_squad_future:
        tournament: '@tournament_squad'
        venue: '@venue_lviv'
        representative: '@player_shevchenko'
        host: '@player_shevchenko'
        playedAt: '<(new \DateTimeImmutable("+7 days"))>'
        estimatedTeams: 5

App\Classic\Entity\SessionClaim:
    claim_squad_approved:
        session: '@session_squad_approved'
        player: '@player_shevchenko'
        status: '<(App\Classic\Enum\SessionClaimStatus::Approved)>'
        createdAt: '<(new \DateTimeImmutable("-5 days"))>'
        resolvedAt: '<(new \DateTimeImmutable("-4 days"))>'
    claim_squad_future:
        session: '@session_squad_future'
        player: '@player_shevchenko'
        status: '<(App\Classic\Enum\SessionClaimStatus::Approved)>'
        createdAt: '<(new \DateTimeImmutable("-5 days"))>'
        resolvedAt: '<(new \DateTimeImmutable("-4 days"))>'

# Question package of the tournament plus its download audit records. Used to
# verify the "former host who downloaded the package" squad restriction.
App\Classic\Entity\TournamentDocument:
    document_squad:
        tournament: '@tournament_squad'
        originalName: 'package.pdf'
        storedName: 'package-abc123.pdf'
        mimeType: 'application/pdf'
        size: 2048

# Host history: both players were once hosts of a session of this tournament.
# player_kotsubynsky also downloaded the package (blocked from being a player);
# player_franko was a host but never downloaded (allowed as a player).
App\Classic\Entity\TournamentSessionHostHistory:
    host_history_squad_kotsubynsky:
        session: '@session_squad_approved'
        player: '@player_kotsubynsky'
    host_history_squad_franko:
        session: '@session_squad_future'
        player: '@player_franko'

App\Classic\Entity\TournamentDocumentDownload:
    download_squad_kotsubynsky:
        document: '@document_squad'
        player: '@player_kotsubynsky'

App\Classic\Entity\TeamPlayer:
    team_player_shevchenko:
        team: '@team_alpha'
        player: '@player_shevchenko'
        season: '@season_current'
        isCaptain: true
    team_player_franko:
        team: '@team_alpha'
        player: '@player_franko'
        season: '@season_current'
        isCaptain: false

App\Classic\Entity\TeamPlayerTransfer:
    transfer_shevchenko_joined:
        player: '@player_shevchenko'
        team: '@team_alpha'
        season: '@season_current'
        type: '<(App\Classic\Enum\TeamPlayerTransferType::Joined)>'
        date: '<(new \DateTimeImmutable("2025-10-01"))>'
    transfer_franko_joined:
        player: '@player_franko'
        team: '@team_alpha'
        season: '@season_current'
        type: '<(App\Classic\Enum\TeamPlayerTransferType::Joined)>'
        date: '<(new \DateTimeImmutable("2025-10-01"))>'

App\Classic\Entity\TournamentSessionTeam:
    session_team_existing:
        tournamentSession: '@session_squad_approved'
        team: '@team_beta'
        score: 5

App\Classic\Entity\TournamentSessionTeamPlayer:
    session_team_player_lesya:
        tournamentSessionTeam: '@session_team_existing'
        player: '@player_lesya'
        isLegionary: false
        isCaptain: true
